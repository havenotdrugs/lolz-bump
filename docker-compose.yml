services:
  lolz-bump:
    build: .
    image: lolz-bump:latest
    container_name: lolz-bump
    env_file:
      - .env
    environment:
      STATE_DB_PATH: /data/state.db
    volumes:
      - ./data:/data
      - lolz-bump-secrets:/secrets
    restart: unless-stopped

volumes:
  lolz-bump-secrets:
